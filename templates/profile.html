<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NETRA • Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<canvas id="particles"></canvas>
<div class="scanlines"></div>

<div class="auth-shell">
  <a href="{{ url_for('dashboard') }}" class="auth-brand">
    <svg viewBox="0 0 64 32" width="38" height="20">
      <ellipse cx="32" cy="16" rx="28" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <circle cx="32" cy="16" r="7" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <circle cx="32" cy="16" r="3" fill="#00e5ff"/>
    </svg>
    <span>NETRA</span>
  </a>

  <div class="auth-card">
    <div class="auth-badge">◈ USER PROFILE</div>
    <h1>{{ user.username }}</h1>
    <p class="auth-sub">{{ user.email }} · role: {{ user.role }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="auth-form">
      <label>
        <span>Current Password</span>
        <input type="password" name="current_password" required id="current-password" />
      </label>
      <label>
        <span>New Password</span>
        <input type="password" name="new_password" required minlength="6" id="new-password" />
      </label>
      <label>
        <span>Confirm New Password</span>
        <input type="password" name="confirm_password" required minlength="6" id="confirm-password" />
      </label>
      <button type="submit" class="btn btn-primary btn-block">⏵ Update Password</button>
    </form>
    <div class="auth-alt">
      <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
</body>
</html>
