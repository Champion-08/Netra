<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NETRA • Spatiotemporal Hotspot Analysis</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="hotspots-body">
<canvas id="particles"></canvas>
<div class="scanlines"></div>

<!-- Header -->
<header class="dash-topbar" style="flex-shrink:0;height:56px;z-index:5;position:relative">
  <div class="brand" style="flex-shrink:0">
    <svg viewBox="0 0 64 32" width="32" height="17"><ellipse cx="32" cy="16" rx="28" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.5"/><circle cx="32" cy="16" r="7" fill="none" stroke="#00e5ff" stroke-width="1.5"/><circle cx="32" cy="16" r="3" fill="#00e5ff"/></svg>
    <span class="brand-text" style="font-size:.95rem">NETRA</span>
    <span style="font-family:var(--font-mono);color:var(--text-dim);font-size:.75rem;margin-left:.3rem">/ Hotspot Analysis</span>
  </div>
  <div class="topbar-sep"></div>
  <div class="topbar-filters">
    <select id="hs-district" class="mini">
      <option value="all">All Districts</option>
    </select>
  </div>
  <div style="margin-left:auto;display:flex;gap:.6rem;align-items:center">
    <span class="dot dot-live"></span>
    <span style="font-family:var(--font-mono);font-size:.7rem;letter-spacing:.2em;color:var(--text-dim)" id="hs-clock"></span>
    <a href="{{ url_for('dashboard') }}" class="btn btn-ghost btn-sm">← Dashboard</a>
    <a href="{{ url_for('logout') }}"    class="btn btn-ghost btn-sm">Logout</a>
  </div>
</header>

<div class="hs-page-grid" style="flex:1;min-height:0;z-index:4;position:relative">

  <!-- Heatmap on leaflet -->
  <section class="panel" data-testid="panel-heatmap-page">
    <div class="panel-head">
      <h2>🌡 Crime Density Heatmap</h2>
      <div class="panel-controls">
        <select id="hs-crime" class="mini">
          <option value="all">All Crime Types</option>
        </select>
      </div>
    </div>
    <div id="map-hotspot" data-testid="map-hotspot"></div>
  </section>

  <!-- Hour-of-day heatgrid -->
  <section class="panel" data-testid="panel-hour-matrix">
    <div class="panel-head">
      <h2>⏰ Crime by Hour of Day</h2>
      <span class="panel-hint" id="peak-info"></span>
    </div>
    <div id="hour-matrix-container" style="flex:1;overflow-y:auto;overflow-x:auto;padding:.5rem">
      <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:.72rem;padding:1rem;text-align:center">Loading…</div>
    </div>
  </section>

  <!-- Day-of-week bar -->
  <section class="panel" data-testid="panel-dow">
    <div class="panel-head"><h2>📅 Crime by Day of Week</h2></div>
    <div style="flex:1;padding:.6rem;min-height:0">
      <canvas id="chart-dow" data-testid="chart-dow"></canvas>
    </div>
  </section>

  <!-- Peak district summary -->
  <section class="panel" data-testid="panel-peaks">
    <div class="panel-head"><h2>🎯 District Peak Times</h2></div>
    <div id="peaks-list" style="flex:1;overflow-y:auto;padding:.5rem;font-family:var(--font-mono);font-size:.75rem">
      <div style="color:var(--text-dim);padding:1rem;text-align:center">Loading…</div>
    </div>
  </section>

</div>

<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
(function() {
  // Clock
  const clockEl = document.getElementById('hs-clock');
  setInterval(() => { if(clockEl) clockEl.textContent = new Date().toLocaleTimeString('en-GB') + ' IST'; }, 1000);

  // Map
  const map = L.map('map-hotspot', { zoomControl:true, preferCanvas:true }).setView([13.5, 76.5], 7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains:'abcd', maxZoom:19, attribution:'&copy; OSM &copy; CARTO'
  }).addTo(map);
  let heatLayer = null;

  async function loadHeatmap() {
    const dist  = document.getElementById('hs-district').value || 'all';
    const crime = document.getElementById('hs-crime').value || 'all';
    const res   = await fetch(`/api/heatmap?district=${encodeURIComponent(dist)}&crime=${encodeURIComponent(crime)}`);
    const data  = await res.json();
    if (heatLayer) map.removeLayer(heatLayer);
    heatLayer = L.heatLayer(data.points, {
      radius: 30, blur: 25, maxZoom: 12,
      gradient: { 0.2:'#4dabff', 0.5:'#ffd700', 0.8:'#ff8c00', 1.0:'#ff0055' }
    }).addTo(map);
  }

  // Populate filters
  fetch('/api/crimes').then(r=>r.json()).then(data => {
    const fd = document.getElementById('hs-district');
    data.meta.districts.forEach(d => fd.add(new Option(d, d)));
    const fc = document.getElementById('hs-crime');
    data.meta.crime_types.forEach(c => fc.add(new Option(c, c)));
  });
  document.getElementById('hs-district').addEventListener('change', () => { loadHeatmap(); loadHotspots(); });
  document.getElementById('hs-crime').addEventListener('change', loadHeatmap);
  loadHeatmap();

  // Hour matrix
  async function loadHotspots() {
    const res  = await fetch('/api/hotspots');
    const data = await res.json();

    // Build grid
    const container = document.getElementById('hour-matrix-container');
    const hours = Array.from({length:24}, (_,i) => i);
    let html = '<div class="hour-heatmap-grid">';

    // Header row
    html += '<div class="hg-label" style="font-size:.55rem;color:var(--primary)">District</div>';
    hours.forEach(h => {
      html += `<div class="hg-header">${String(h).padStart(2,'0')}</div>`;
    });

    // District rows
    const selDist = document.getElementById('hs-district').value;
    const districts = selDist !== 'all' ? [selDist] : Object.keys(data.hour_matrix);
    const allVals = districts.flatMap(d => data.hour_matrix[d] || []);
    const maxVal  = Math.max(...allVals, 1);

    districts.forEach(dist => {
      const counts = data.hour_matrix[dist] || Array(24).fill(0);
      const shortDist = dist.replace(' Urban','').replace('Bengaluru','BLR').substring(0,7);
      html += `<div class="hg-label" title="${dist}">${shortDist}</div>`;
      counts.forEach((cnt, h) => {
        const intensity = cnt / maxVal;
        const r = Math.round(intensity * 255);
        const b = Math.round((1 - intensity) * 180);
        const bg = cnt === 0 ? 'rgba(0,229,255,.04)' : `rgba(${r},${Math.round(intensity*80)},${b},${0.3 + intensity*0.7})`;
        html += `<div class="hg-cell" style="background:${bg}" title="${dist} · ${String(h).padStart(2,'0')}:00 · ${cnt} crimes"></div>`;
      });
    });
    html += '</div>';
    container.innerHTML = html;

    // Peak info
    const peakEl = document.getElementById('peak-info');
    if (peakEl && data.peaks) {
      const allPeaks = Object.values(data.peaks);
      if (allPeaks.length) {
        const bestH = allPeaks.reduce((a,b) => b.peak_count > a.peak_count ? b : a);
        peakEl.textContent = `Peak: ${String(bestH.peak_hour).padStart(2,'0')}:00`;
      }
    }

    // DoW chart
    const dowEl = document.getElementById('chart-dow');
    if (dowEl && data.dow_counts) {
      new Chart(dowEl, {
        type: 'bar',
        data: {
          labels: data.dow_labels,
          datasets: [{ label:'Crimes', data:data.dow_counts, backgroundColor:'rgba(0,229,255,.6)', borderColor:'#00e5ff', borderWidth:1 }],
        },
        options: {
          responsive:true, maintainAspectRatio:false,
          plugins: { legend:{display:false}, title:{display:true, text:'Crime Distribution by Day of Week', color:'#00e5ff', font:{family:'Orbitron',size:10}} },
          scales: {
            x: { ticks:{color:'#7f95ac',font:{size:9}}, grid:{color:'rgba(0,229,255,0.06)'} },
            y: { ticks:{color:'#7f95ac',font:{size:9}}, grid:{color:'rgba(0,229,255,0.06)'}, beginAtZero:true },
          }
        },
      });
    }

    // Peaks list
    const peaksList = document.getElementById('peaks-list');
    if (peaksList && data.peaks) {
      const entries = Object.entries(data.peaks).sort((a,b) => b[1].peak_count - a[1].peak_count);
      peaksList.innerHTML = entries.map(([dist, p]) => `
        <div style="display:flex;align-items:center;gap:.7rem;padding:.5rem .6rem;border-bottom:1px solid var(--border-3)">
          <div style="flex:1">
            <div style="color:#e8fdff;margin-bottom:.15rem">${dist}</div>
            <div style="color:var(--text-dim);font-size:.65rem">Night crimes: ${p.night_pct}%</div>
          </div>
          <div style="text-align:right">
            <div style="color:var(--primary);font-family:var(--font-head);font-size:1rem">${String(p.peak_hour).padStart(2,'0')}:00</div>
            <div style="color:var(--text-dim);font-size:.62rem">${p.peak_count} crimes</div>
          </div>
        </div>`).join('');
    }
  }

  loadHotspots();
})();
</script>
</body>
</html>
