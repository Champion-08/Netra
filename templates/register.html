<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NETRA • Register</title>
<meta name="description" content="Create your NETRA analyst account to access the intelligence platform." />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<canvas id="particles"></canvas>
<div class="scanlines"></div>

<div class="auth-shell">
  <a href="{{ url_for('index') }}" class="auth-brand" data-testid="brand-link">
    <svg viewBox="0 0 64 32" width="38" height="20">
      <ellipse cx="32" cy="16" rx="28" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <circle cx="32" cy="16" r="7" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <circle cx="32" cy="16" r="3" fill="#00e5ff"/>
    </svg>
    <span>NETRA</span>
  </a>

  <div class="auth-card" data-testid="register-card">
    <div class="auth-badge">◆ NEW OPERATIVE</div>
    <h1>Create Credentials</h1>
    <p class="auth-sub">Provision access to the intelligence platform.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}" data-testid="flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('register') }}" class="auth-form" data-testid="register-form">
      <label>
        <span>Username</span>
        <input type="text" name="username" required minlength="3"
               id="register-username" data-testid="register-username-input" placeholder="agent_smith" />
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" required
               id="register-email" data-testid="register-email-input" placeholder="you@department.gov" />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required minlength="6"
               id="register-password" data-testid="register-password-input" placeholder="min 6 chars" />
      </label>
      <label>
        <span>Confirm Password</span>
        <input type="password" name="confirm_password" required minlength="6"
               id="register-confirm" data-testid="register-confirm-input" placeholder="re-enter password" />
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="register-submit" data-testid="register-submit-btn">
        ⏵ Provision Access
      </button>
    </form>

    <div class="auth-alt">
      Already enrolled? <a href="{{ url_for('login') }}" data-testid="login-link">Login &rarr;</a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/particles.js') }}"></script>
</body>
</html>
